    <div id="app">

    <script>
        /**
         * How to add a new page:
         * 1. Create a component object below (e.g., const NewPage = { template: '...', setup() { ... } })
         * 2. Add a new route definition in the `routes` array (e.g., { path: '/new', component: NewPage })
         * 3. Navigate using `router.push('/new')`
         */

        const { createApp, ref, onMounted } = Vue;
        const { createRouter, createWebHashHistory } = VueRouter;

        // Shared device fingerprint composable logic required by spec 1.2
        function useDeviceFingerprint() {
            return ref((function () {
                try {
                    let canvas = document.createElement("canvas");
                    let ctx = canvas.getContext("2d");
                    let txt = "BrowserLeaks,com <canvas> 1.0";
                    ctx.textBaseline = "top";
                    ctx.font = "14px 'Arial'";
                    ctx.textBaseline = "alphabetic";
                    ctx.fillStyle = "#f60";
                    ctx.fillRect(125,1,62,20);
                    ctx.fillStyle = "#069";
                    ctx.fillText(txt, 2, 15);
                    ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                    ctx.fillText(txt, 4, 17);
                    return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                } catch (e) {
                    return '';
                }
            })());
        }

        // Loading Component (Route: /loading)
        const LoadingView = {
            template: `
                <div class="view-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Loading</div>
                </div>
            `,
            setup() {
                const router = VueRouter.useRouter();
                const device = useDeviceFingerprint();

                onMounted(() => {
                    const apiBase = window.appInformation.apiBase.replace(/\/+$/, '');
                    const identifier = window.appInformation.identifier;

                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');
                        });
                });

                return {};
            }
        };

        // Home Component (Route: /home)
        const HomeView = {
            template: `
                <div class="view-container">
                    <div class="home-content">
                        <img :src="appIcon" class="app-icon" alt="App Icon" />
                        <h1 class="app-title">{{ appName }}</h1>
                        <div class="device-card">
                            <div class="device-label">Canvas Device Fingerprint</div>
                            <div class="device-hash">{{ device }}</div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const device = useDeviceFingerprint();
                const appName = window.appInformation.name;
                const appIcon = window.appInformation.icon;

                return {
                    device,
                    appName,
                    appIcon
                };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', redirect: '/loading' },
            { path: '/loading', component: LoadingView },
            { path: '/home', component: HomeView }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        const app = createApp({});
        app.use(router);
        app.mount('#app');
    </script>
